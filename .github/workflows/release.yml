name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.24'
  REGISTRY: quay.io
  IMAGE_NAME: zhujian/mytest-apiserver

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Get version
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Simple changelog generation from git log
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "## Changes in ${{ steps.get_version.outputs.version }}" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        git log --oneline --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2.3.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        body: |
          # MyTest API Server ${{ steps.get_version.outputs.version }}
          
          ## Docker Images
          
          ```bash
          # Pull the latest release
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}
          
          # Deploy with Helm or kubectl
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/mytest-apiserver-manifests-${{ steps.get_version.outputs.version }}.tar.gz | tar xz
          kubectl apply -f manifests/
          ```
          
          ## Installation
          
          ### Quick Start with Kind
          ```bash
          # Download and extract
          curl -L https://github.com/${{ github.repository }}/archive/${{ steps.get_version.outputs.version }}.tar.gz | tar xz
          cd mytest-apiserver-*
          
          # Set up development environment
          make dev-setup
          ```
          
          ### Manual Installation
          ```bash
          # Download binary
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/mytest-apiserver-linux-amd64 -o mytest-apiserver
          chmod +x mytest-apiserver
          ```
          
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ## Verification
          
          All artifacts are signed with Cosign. Verify with:
          ```bash
          cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}
          ```
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}

  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build binary
      run: |
        mkdir -p bin
        BINARY_NAME="mytest-apiserver-${{ matrix.os }}-${{ matrix.arch }}"
        if [ "${{ matrix.os }}" = "windows" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
        fi
        
        CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
        go build -ldflags="-w -s -X main.version=${{ needs.create-release.outputs.version }} -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -o bin/${BINARY_NAME} .

    - name: Generate checksums
      run: |
        cd bin
        sha256sum mytest-apiserver-* > checksums.txt

    - name: Upload binary
      uses: softprops/action-gh-release@v2.3.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        files: ./bin/mytest-apiserver-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}

    - name: Upload checksums
      if: matrix.os == 'linux' && matrix.arch == 'amd64'
      uses: softprops/action-gh-release@v2.3.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        files: ./bin/checksums.txt

  build-manifest-artifacts:
    name: Build Manifest Artifacts
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prepare deployment artifacts
      run: |
        mkdir -p release-artifacts/manifests
        
        # Debug environment variables
        echo "REGISTRY: ${{ env.REGISTRY }}"
        echo "IMAGE_NAME: ${{ env.IMAGE_NAME }}"
        echo "VERSION: ${{ needs.create-release.outputs.version }}"
        
        # Update image tags in deployment files and copy directly to manifests folder
        echo "Updating image tag to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}"
        sed "s|image: quay.io/zhujian/mytest-apiserver:dev|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}|g" \
          deploy/base/deploy.yaml > release-artifacts/manifests/deploy.yaml
        
        # Verify the sed command worked
        EXPECTED_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}"
        echo "Expected image: $EXPECTED_IMAGE"
        echo "Checking if replacement worked..."
        
        if ! grep -q "$EXPECTED_IMAGE" release-artifacts/manifests/deploy.yaml; then
          echo "Error: Image tag replacement failed"
          echo "Expected: $EXPECTED_IMAGE"
          echo "Actual content around image line:"
          grep -A 3 -B 3 "image:" release-artifacts/manifests/deploy.yaml || echo "No image line found"
          echo ""
          echo "Original file content around image line:"
          grep -A 3 -B 3 "image:" deploy/base/deploy.yaml || echo "No image line found in original"
          exit 1
        fi
        echo "✅ Image tag replacement successful"
        
        # Copy other deployment files directly to manifests folder
        cp deploy/base/apiservice.yaml release-artifacts/manifests/
        cp -r deploy/certificates release-artifacts/manifests/
        cp deploy/README.md release-artifacts/manifests/
        
        # Create manifests bundle from the manifests subdirectory
        tar -czf release-artifacts/mytest-apiserver-manifests-${{ needs.create-release.outputs.version }}.tar.gz -C release-artifacts manifests

    - name: Upload manifests bundle
      uses: softprops/action-gh-release@v2.3.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.create-release.outputs.version }}
        files: ./release-artifacts/mytest-apiserver-manifests-${{ needs.create-release.outputs.version }}.tar.gz

  docker-release:
    name: Build and Push Release Docker Image
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      id-token: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.11.1

    - name: Log in to Container Registry
      uses: docker/login-action@v3.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    - name: Build and push release image
      uses: docker/build-push-action@v6.18.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        build-args: |
          VERSION=${{ needs.create-release.outputs.version }}
          COMMIT=${{ github.sha }}
          DATE=${{ github.event.head_commit.timestamp }}

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.10.0

    - name: Sign release image
      env:
        COSIGN_EXPERIMENTAL: 1
      run: |
        cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries, build-manifest-artifacts, docker-release]
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.create-release.result == 'success' && needs.build-binaries.result == 'success' && needs.docker-release.result == 'success'
      run: |
        echo "🎉 Release ${{ needs.create-release.outputs.version }} completed successfully!"
        echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}"

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Release ${{ needs.create-release.outputs.version }} failed!"
        echo "Check the workflow logs for details."
